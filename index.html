<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f7f7f4"><title>Triploop — 내 여행</title>
<style>
:root{--bg:#f7f7f4;--panel:#fff;--ink:#242620;--muted:#85877f;--line:#e8e8e1;--accent:#66745d;--soft:#edf0e9;--danger:#b45b50}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input{font:inherit}button{cursor:pointer}.app{max-width:1080px;margin:0 auto;padding:34px 24px 50px}
.top{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:52px}.brand{font-size:26px;font-weight:800;letter-spacing:-1.4px}.brand span{color:var(--accent)}.sub{font-size:13px;color:var(--muted);margin-top:5px}.revision-top{font-size:11px;color:#a0a198;margin-top:3px}
.primary{border:0;border-radius:12px;background:var(--accent);color:white;padding:13px 18px;font-weight:650}.primary:hover{filter:brightness(.96)}
h1{font-size:clamp(26px,4vw,36px);letter-spacing:-1.5px;margin:0 0 9px}.intro{color:var(--muted);font-size:14px;margin:0 0 30px}
.toolbar{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:18px}.eyebrow{font-size:11px;letter-spacing:1.4px;font-weight:750;color:var(--accent);text-transform:uppercase;margin-bottom:9px}
.count{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;min-height:188px;display:flex;flex-direction:column;transition:transform .15s,border-color .15s;cursor:pointer}
.card:hover{transform:translateY(-2px);border-color:#c9cec1}.card-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.city{font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.3px}.trip-title{font-size:21px;font-weight:750;letter-spacing:-.7px;margin:8px 0 7px}.dates{font-size:13px;color:var(--muted)}
.meta{display:flex;gap:18px;margin-top:auto;padding-top:24px;color:#62665d;font-size:12px}.meta span{display:flex;gap:5px;align-items:center}
.actions{display:flex;gap:6px}.small{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:12px;color:#686b63}.small:hover{background:var(--soft)}.small.delete{color:var(--danger)}
.empty{border:1px dashed #d5d7cf;border-radius:18px;padding:55px 20px;text-align:center;background:rgba(255,255,255,.55)}.empty strong{display:block;font-size:17px;margin-bottom:8px}.empty p{color:var(--muted);font-size:13px;margin:0 0 18px}
footer{font-size:11px;color:#a0a198;text-align:center;margin-top:58px}
dialog{border:0;border-radius:20px;padding:0;width:min(440px,calc(100% - 28px));box-shadow:0 24px 80px #20251b30}dialog::backdrop{background:#20251b66}.modal{padding:24px}.modal h2{margin:0 0 20px;font-size:21px;letter-spacing:-.6px}.field{width:100%;border:1px solid var(--line);border-radius:11px;padding:12px;background:#fff;color:var(--ink);outline:none}.field:focus{border-color:var(--accent)}label{display:block;font-size:12px;color:var(--muted);margin:13px 0 6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.ghost{border:1px solid var(--line);border-radius:11px;background:#fff;padding:12px 15px;color:var(--ink)}
@media(max-width:680px){.app{padding:24px 16px 36px}.top{margin-bottom:38px}.grid{grid-template-columns:1fr}.card{min-height:170px}.toolbar{align-items:center}.intro{margin-bottom:24px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div><div class="brand">trip<span>loop</span></div><div class="sub">여행을 한곳에서 관리하세요.</div><div class="revision-top">Triploop · 수정본 15</div></div><button class="primary" id="newTrip">＋ 새 여행 만들기</button></header>
<main>
<div class="eyebrow">YOUR TRIPS</div><h1>어디로 떠나볼까요?</h1><p class="intro">여행을 만들고 날짜별 일정을 한곳에서 관리할 수 있어요.</p>
<div class="toolbar"><div class="count" id="tripCount">여행 0개</div></div>
<section class="grid" id="tripGrid"></section>
</main>

</div>
<dialog id="tripDialog"><form class="modal" id="tripForm">
<h2 id="dialogTitle">새 여행 만들기</h2><input type="hidden" id="tripId">
<label for="tripName">여행 이름</label><input class="field" id="tripName" required maxlength="60" placeholder="예: 멜버른 여행">
<label for="tripCity">도시</label><input class="field" id="tripCity" required maxlength="60" placeholder="예: Melbourne">
<div class="two"><div><label for="tripStart">시작일</label><input class="field" id="tripStart" type="date" required></div><div><label for="tripEnd">종료일</label><input class="field" id="tripEnd" type="date" required></div></div>
<div class="modal-actions"><button type="button" class="ghost" id="cancelDialog">취소</button><button class="primary" type="submit">저장</button></div>
</form></dialog>
<script>
const TRIPS_KEY='triploop_trips_v1',LEGACY_KEY='triploop_mvp_v1';
const $=id=>document.getElementById(id);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const readTrips=()=>{try{return JSON.parse(localStorage.getItem(TRIPS_KEY)||'[]')}catch{return []}};
let trips=readTrips();
if(!localStorage.getItem(TRIPS_KEY)){
  const legacy=localStorage.getItem(LEGACY_KEY);
  if(legacy){try{const old=JSON.parse(legacy);const id='trip-'+Date.now();const trip={id,title:old.title||'멜버른 여행',city:old.city||'Melbourne',start:old.start,end:old.end,accommodation:old.accommodation||'',placeCount:(old.stops||[]).length};localStorage.setItem('triploop_trip_'+id,JSON.stringify(old));trips=[trip];localStorage.setItem(TRIPS_KEY,JSON.stringify(trips));}catch{}}
}
function saveTrips(){localStorage.setItem(TRIPS_KEY,JSON.stringify(trips))}
function dayCount(t){if(!t.start||!t.end)return 0;const a=new Date(t.start+'T12:00:00'),b=new Date(t.end+'T12:00:00');return Math.max(0,Math.round((b-a)/86400000)+1)}
function dateLabel(d){if(!d)return '';const x=new Date(d+'T12:00:00');return x.toLocaleDateString('ko-KR',{year:'numeric',month:'short',day:'numeric'})}
function render(){
 $('tripCount').textContent='여행 '+trips.length+'개';
 $('tripGrid').innerHTML='';
 if(!trips.length){$('tripGrid').innerHTML='<div class="empty" style="grid-column:1/-1"><strong>아직 만든 여행이 없어요.</strong><p>첫 여행을 추가하면 이곳에서 날짜별 일정을 관리할 수 있어요.</p><button class="primary" id="emptyNewTrip">＋ 첫 여행 만들기</button></div>';$('emptyNewTrip').addEventListener('click',()=>showDialog(null));return}
 trips.sort((a,b)=>(a.start||'').localeCompare(b.start||''));
 trips.forEach(t=>{
  const card=document.createElement('article');card.className='card';card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',t.title+' 일정 열기');
  card.innerHTML='<div class="card-top"><div><div class="city">'+esc(t.city||'도시 미정')+'</div><div class="trip-title">'+esc(t.title||'이름 없는 여행')+'</div><div class="dates">'+esc(dateLabel(t.start))+' — '+esc(dateLabel(t.end))+'</div></div><div class="actions"><button class="small edit">수정</button><button class="small delete">삭제</button></div></div><div class="meta"><span>▦ '+dayCount(t)+'일 일정</span><span>⌖ '+(Number(t.placeCount)||0)+'개 장소</span></div>';
  const open=()=>location.href='triploop_mvp.html?trip='+encodeURIComponent(t.id);
  card.addEventListener('click',e=>{if(!e.target.closest('button'))open()});
  card.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target===card){e.preventDefault();open()}});
  card.querySelector('.edit').addEventListener('click',e=>{e.stopPropagation();showDialog(t)});
  card.querySelector('.delete').addEventListener('click',e=>{e.stopPropagation();if(confirm('「'+t.title+'」 여행을 삭제할까요? 일정도 함께 삭제됩니다.')){trips=trips.filter(x=>x.id!==t.id);localStorage.removeItem('triploop_trip_'+t.id);saveTrips();render()}});
  $('tripGrid').append(card);
 });
}
function showDialog(t){
 $('tripForm').reset();$('tripId').value=t?.id||'';$('dialogTitle').textContent=t?'여행 정보 수정':'새 여행 만들기';
 $('tripName').value=t?.title||'';$('tripCity').value=t?.city||'';$('tripStart').value=t?.start||today();$('tripEnd').value=t?.end||t?.start||today();
 $('tripDialog').showModal();
}
$('newTrip').addEventListener('click',()=>showDialog(null));
$('cancelDialog').addEventListener('click',()=>$('tripDialog').close());
$('tripForm').addEventListener('submit',e=>{
 e.preventDefault();const id=$('tripId').value||('trip-'+Date.now());
 const start=$('tripStart').value,end=$('tripEnd').value;if(end<start){alert('종료일은 시작일보다 빠를 수 없어요.');return}
 const old=trips.find(t=>t.id===id);
 if(old){const title=$('tripName').value.trim(),city=$('tripCity').value.trim();Object.assign(old,{title,city,start,end});const saved=JSON.parse(localStorage.getItem('triploop_trip_'+id)||'{}');Object.assign(saved,{title,city,start,end});localStorage.setItem('triploop_trip_'+id,JSON.stringify(saved));}
 else{const t={id,title:$('tripName').value.trim(),city:$('tripCity').value.trim(),start,end,accommodation:'',placeCount:0};trips.push(t);localStorage.setItem('triploop_trip_'+id,JSON.stringify({title:t.title,city:t.city,start,end,accommodation:'',stops:[]}));}
 saveTrips();$('tripDialog').close();render();
});
render();
</script>
</body></html>
